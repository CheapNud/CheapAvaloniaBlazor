name: Publish NuGet

# Release mechanism: push a v*.*.* tag. GitHub is a sync mirror; publishing runs here.

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CONFIGURATION: Release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    name: Build, Pack and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup-dotnet: the ubuntu-latest runner image has the .NET SDK baked in
      # (ci-dotnet) and mounts a persistent NuGet cache, same as build.yml.
      # 3.4.0 shipped with the templates still pinned to 3.3.1: pack produced a 3.3.1 template
      # package and --skip-duplicate dropped it silently, so `dotnet new cheapblazor` kept
      # scaffolding the old library. Fail the release instead of publishing half of it.
      - name: Check version pins agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=0
          for file in CheapAvaloniaBlazor.csproj templates/CheapAvaloniaBlazor.Templates.csproj templates/content/CheapBlazorApp/CheapBlazorApp.csproj templates/content/CheapBlazorApp-Full/CheapBlazorApp.csproj samples/TemplateApp/TemplateApp.csproj; do
            # Anchored: a bare substring match would accept 3.4.10 for a v3.4.1 tag.
            if ! grep -qE "<Version>$version</Version>|Version=\"$version\"" "$file"; then
              echo "::error file=$file::expected version $version (from tag $GITHUB_REF_NAME)"
              status=1
            fi
          done
          exit $status

      - name: Restore
        run: dotnet restore CheapAvaloniaBlazor.csproj
      - name: Build
        run: dotnet build CheapAvaloniaBlazor.csproj --configuration ${{ env.CONFIGURATION }} --no-restore
      - name: Test
        run: dotnet test --project CheapAvaloniaBlazor.Tests/CheapAvaloniaBlazor.Tests.csproj --configuration ${{ env.CONFIGURATION }} --verbosity normal
      # Pack with --no-build after an explicit build: packing this csproj in one go trips
      # a staticwebassets manifest ordering problem with GeneratePackageOnBuild.
      - name: Pack library
        run: dotnet pack CheapAvaloniaBlazor.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./nupkgs
      - name: Pack templates
        run: dotnet pack templates/CheapAvaloniaBlazor.Templates.csproj --configuration ${{ env.CONFIGURATION }} --output ./nupkgs
      - name: Publish to NuGet.org
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
