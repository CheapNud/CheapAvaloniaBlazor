name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Everything in this repo targets net10.0 — installing only the 11-preview SDK
      # leaves out the ASP.NET Core 10 runtime and the Testing.Platform test host
      # can't even launch (the failure shows zero tests failed, just app-launch-failed).
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: |
          dotnet restore samples/DesktopFeatures/DesktopFeatures.csproj
          dotnet restore samples/MinimalApp/MinimalApp.csproj

      - name: Build
        run: |
          dotnet build samples/DesktopFeatures/DesktopFeatures.csproj --no-restore --configuration Release
          dotnet build samples/MinimalApp/MinimalApp.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project CheapAvaloniaBlazor.Tests/CheapAvaloniaBlazor.Tests.csproj --configuration Release --verbosity normal
